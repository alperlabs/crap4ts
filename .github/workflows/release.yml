name: Release

# Semantic-versioned releases on every merge to main: the next version is
# computed from conventional commit messages (feat → minor, fix → patch,
# BREAKING CHANGE → major, default patch), the tag and GitHub Release are
# created automatically, and the package publishes to npm with provenance
# under the computed version.
on:
  push:
    branches: [main]
  # Manual fallback: re-run the release from the Actions tab.
  workflow_dispatch:

concurrency: release

jobs:
  version:
    name: Create Release Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      changelog: ${{ steps.tag.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # First release only: adopt the version already in package.json as the
      # baseline tag, so the bump history starts from it instead of v0.0.1.
      - name: Seed initial tag from package.json
        id: seed
        run: |
          if [ -n "$(git tag -l 'v*')" ]; then
            echo "seeded=false" >> "$GITHUB_OUTPUT"
          else
            TAG="v$(node -p "require('./package.json').version")"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
            echo "seeded=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - id: tag
        if: steps.seed.outputs.seeded == 'false'
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          # Conventional commits for version bumping:
          # - "feature:" or "feat:" → minor bump (0.2.0 → 0.3.0)
          # - "fix:", "bugfix:", or "bug:" → patch bump (0.2.0 → 0.2.1)
          # - "BREAKING CHANGE" → major bump (0.2.0 → 1.0.0)
          custom_release_rules: |
            major: 'BREAKING CHANGE'
            minor: 'feature|feat'
            patch: 'fix|bugfix|bug'

      - name: Resolve version
        id: resolve
        run: |
          TAG="${{ steps.seed.outputs.tag || steps.tag.outputs.new_tag }}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG}"

      - name: Create GitHub Release
        if: steps.resolve.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve.outputs.version }}
          name: ${{ steps.resolve.outputs.version }}
          body: ${{ steps.tag.outputs.changelog }}
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: version
    if: needs.version.outputs.version != ''
    permissions:
      contents: read
      # Required for npm provenance attestation.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Sync package.json to the released version
        run: npm version --no-git-tag-version "${TAG#v}"
        env:
          TAG: ${{ needs.version.outputs.version }}
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Self CRAP gate
        run: node dist/main.js
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
